name: Terraform Apply

on:
  push:
    branches:
      - debug
    paths:
      - 'terraform/**'

permissions:
  contents: read

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: debug  # GitHub Environment による承認ゲート

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
          TF_VAR_k8s_client_certificate: ${{ secrets.K8S_CLIENT_CERT }}
          TF_VAR_k8s_client_key: ${{ secrets.K8S_CLIENT_KEY }}
          TF_VAR_k8s_cluster_ca_certificate: ${{ secrets.K8S_CA_CERT }}

      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
          title: "Terraform Apply (debug)"
          description: "debug ブランチの Terraform Apply が ${{ job.status }} になりました"
