# LoadBalancer Service - MetalLB が mc-debug-pool (192.168.10.231-240) から IP を割り当て
apiVersion: v1
kind: Service
metadata:
  name: minecraft-debug
  namespace: minecraft-debug
  labels:
    app: minecraft-debug
  annotations:
    metallb.universe.tf/address-pool: mc-debug-pool
spec:
  type: LoadBalancer
  selector:
    app: minecraft-debug
  ports:
    - name: mc
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
---
# Headless Service - StatefulSet の stable DNS 名用
apiVersion: v1
kind: Service
metadata:
  name: minecraft-debug-headless
  namespace: minecraft-debug
spec:
  clusterIP: None
  selector:
    app: minecraft-debug
  ports:
    - name: mc
      port: 25565
      targetPort: 25565
