apiVersion: v1
kind: Service
metadata:
  name: bluemap
  namespace: minecraft-debug
  labels:
    app: bluemap
  annotations:
    metallb.universe.tf/address-pool: mc-debug-pool
    metallb.universe.tf/loadBalancerIPs: "192.168.10.232"
spec:
  type: LoadBalancer
  selector:
    app: bluemap
  ports:
    - name: web
      port: 8100
      targetPort: 8100
      protocol: TCP
