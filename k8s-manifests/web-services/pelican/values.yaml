# Pelican Panel - ゲームサーバー管理パネル
# 現在 i3 検証サーバーにベアメタルインストール済みのため
# k8s 移行は将来フェーズで実施予定

# NOTE: この values.yaml は k8s 移行時の参照用
# 現状は 01_physical_infrastructure.md 参照

replicaCount: 1

image:
  repository: ghcr.io/pelican-dev/panel
  tag: latest

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClass: synology-csi
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  APP_ENV: "debug"
  APP_URL: "https://pelican.strategy-games.net"
  DB_CONNECTION: "mysql"
  DB_HOST: "mariadb.minecraft-debug.svc.cluster.local"
  DB_DATABASE: "pelican_debug"
